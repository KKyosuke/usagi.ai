[package]
name = "usagi"
version = "0.2.0"
edition = "2021"
repository = "https://github.com/KKyosuke/usagi.ai"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = { version = "0.18", features = ["vendored-openssl", "vendored-libgit2"] }
directories = "5.0"
inquire = "0.7"
console = "0.15"
ctrlc = "3.4"
chrono = { version = "0.4.44", features = ["clock"] }
portable-pty = "0.8"
vt100 = "0.15"
ratatui = "0.26"
crossterm = "0.27"
llama-cpp-2 = { version = "0.1.144", features = ["sampler"] }
llm = "1.3.8"
