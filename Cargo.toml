[package]
name = "usagi"
version = "0.1.1"
edition = "2021"
repository = "https://github.com/KKyosuke/usagi.ai"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = { version = "0.18", features = ["vendored-openssl", "vendored-libgit2"] }
directories = "5.0"
inquire = "0.7"
console = "0.15"
ctrlc = "3.4"
